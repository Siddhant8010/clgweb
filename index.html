
<!DOCTYPE html>
<html>
<head>
    <title>My First Webpage</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: lightgray;
        }

        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: black;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .content {
            background-color: white;
            margin: 30px;
            padding: 25px;
            text-align: center;
        }

        button {
            background-color: navy;
            color: white;
            padding: 10px 20px;
            border: none;
        }

        footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My College Website</h1>
        <p>Welcome to Our College</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>
    </nav>

    <div class="content">
        <h2>About Our College</h2>
        <p>Our college provides quality education
        and excellent facilities to students.</p>

        <h3>Our Courses</h3>
        <p>Computer Engineering</p>
        <p>Information Technology</p>
        <p>Mechanical Engineering</p>

        <button>Learn More</button>
    </div>

    <footer>
        <p>Copyright 2026 My College Website</p>
    </footer>

</body>
</html>
